version: 2
updates:
  # One entry per package.json / lockfile. Weekly, grouped so a week's bumps
  # arrive as one PR per directory instead of one per package.
  # cooldown: a release is proposed only once it is 7 days old, so a hijacked
  # package version that the registry pulls within days never reaches a PR
  # (GitHub's Dependabot options reference, "cooldown"). It applies to version
  # updates only: security updates still open at once.
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  # maplibre-gl gets a group of its own, out of the weekly one: each release
  # replaces its ~440 KB chunk (vendorChunks.js), which every returning visitor
  # downloads again, so its PR waits apart from the others and is merged about
  # once a month instead of riding along every week. (The options reference has
  # no per-dependency schedule: a second "/app" entry would overlap this one,
  # which it forbids.) Groups and cooldown apply to version updates only, so a
  # maplibre-gl security update still opens at once, on its own.
  - package-ecosystem: npm
    directory: "/app"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      maplibre: { patterns: [maplibre-gl] }
      minor-and-patch: { update-types: [minor, patch], exclude-patterns: [maplibre-gl] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
