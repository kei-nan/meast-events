name: CI

# Build verification only - this does NOT deploy anything. Deployment is
# handled by the hosting provider's own git integration (see DEPLOYMENT.md
# at the repo root): once the repo is connected there, every push to main
# that passes this workflow also triggers a new deploy on the host's side,
# and every pull request gets its own preview deploy automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build app/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Build
        working-directory: app
        run: npm run build
