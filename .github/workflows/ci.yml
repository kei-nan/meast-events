name: CI

# Build verification only - this does NOT deploy anything. Deployment is
# handled by the hosting provider's own git integration (see DEPLOYMENT.md
# at the repo root): once the repo is connected there, every push to main
# that passes this workflow also triggers a new deploy on the host's side,
# and every pull request gets its own preview deploy automatically.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job needs to write to the repo or PRs.
permissions:
  contents: read

jobs:
  build:
    name: Build app/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      # Pure-logic unit tests for the frontend (ranking, geo, URL state, ...).
      # No dependencies: node's built-in test runner, run from the repo root.
      - name: Unit tests (app/src/lib)
        run: node --test app/src/lib/*.test.js

      - name: Build
        working-directory: app
        run: npm run build

  worker:
    name: Bundle worker/ (dry run)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Unit tests
        working-directory: worker
        run: npm test

      # --dry-run bundles the Worker (cloudflare:sockets import, nodejs_compat)
      # exactly as `wrangler deploy` would, but uploads nothing and needs no
      # Cloudflare credentials.
      - name: Bundle (deploy dry run)
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir=.dry-run

  data:
    name: Validate event data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Structural checks only (schema, ids, dates, coordinates, extracts) on
      # data/events.json and data/events.proposed.json. No dependencies, no network.
      - name: Validate events
        run: node scripts/validate-events.js

  audit:
    name: Dependency audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [".", app, worker, server]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # BLOCKING for what ships/runs in production: runtime dependencies only
      # (--omit=dev), high or critical advisories only. `npm audit` reads the
      # lockfile and asks the registry; no install needed.
      - name: npm audit (production deps, high+, blocking)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

      # REPORT-ONLY for build tooling (vite, wrangler, ...): a new advisory in a
      # dev tool should show up in the log and in Dependabot PRs but must not
      # block unrelated pull requests. continue-on-error keeps the job green.
      - name: npm audit (all deps, report only)
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        run: npm audit --audit-level=high
