name: CI

# Build verification only - this does NOT deploy anything, and it does NOT
# gate deploys. Cloudflare Workers Builds (see DEPLOYMENT.md at the repo root)
# deploys every push to main on its own, whether or not this workflow passed,
# and builds a preview for every other branch. What stops a bad deploy is the
# build itself: `npm run build` in app/ fails (so Cloudflare does not deploy)
# when the event data is invalid or the built dist/ fails check-dist.mjs. The
# other jobs here (data pipeline tests, lint, border checks, audit) only block
# a merge if they are required status checks on main (DEPLOYMENT.md,
# "Recommended repository settings").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Started by refresh-data.yml on the branch of the pull request it opens: a PR
  # opened with the workflow token gets no pull_request run without a person's
  # approval, and a workflow_dispatch run's checks land on the branch's head
  # commit. Also usable by hand from the Actions tab.
  workflow_dispatch:

# Least privilege: no job needs to write to the repo or PRs.
permissions:
  contents: read

# One run per branch or pull request at a time. A new push to a pull request
# cancels its run still in progress (only the newest commit's result matters
# there); runs on main are never cancelled, so every commit on main gets a
# complete run. github.ref keeps the groups apart: refs/pull/<n>/merge for a
# pull request, refs/heads/<branch> for a push or workflow_dispatch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build app/
    runs-on: ubuntu-latest
    # Usually about a minute; a hung step (e.g. the smoke test's browser) fails instead of running for hours.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes or calls the API: keep the token out of .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # oxlint (app/.oxlintrc.json: react, jsx-a11y and import plugins); warnings fail.
      # Its prelint script first writes the generated src/lib/dataVersion.js
      # (scripts/split-data.mjs, as predev/prebuild do), so import/named checks
      # the imports from it against the current data, not a missing or stale copy.
      - name: Lint
        working-directory: app
        run: npm run lint

      # Unit tests for the frontend (src/lib, src/components, scripts): node's
      # built-in test runner. They do not read the generated
      # src/lib/dataVersion.js: tests that need it stub it (and Vite's
      # import.meta.env) with src/lib/testing/viteNodeHooks.mjs.
      - name: Unit tests (app/src and app/scripts)
        working-directory: app
        run: npm test

      # Workers Builds reads app/.nvmrc (its root directory is app/); CI reads
      # the repo-root .nvmrc. Keep the two identical.
      - name: Node version files agree
        run: cmp .nvmrc app/.nvmrc

      # The same command Workers Builds runs. Its npm hooks validate
      # data/events.json first (prebuild: ../scripts/validate-events.js) and
      # check the finished dist/ last (postbuild: scripts/check-dist.mjs: the
      # content-hashed events folder named by dataVersion.js, consistent
      # ids/meta, every asset index.html loads, hashed names under assets/),
      # so a failure here also fails the deploy.
      - name: Build (validates data before, checks dist/ after)
        working-directory: app
        run: npm run build

      # Runs the built site under its production headers (wrangler dev applies
      # dist/_headers, CSP included) in the runner's preinstalled Chrome, and
      # checks the map draws, full-text search answers (Pagefind and its
      # WebAssembly), an event and the About dialog open, /event/<id> loads, and
      # nothing logs an error or a CSP violation. Local only (no account, no
      # deploy), and CI only: Workers Builds does not run it, so it gates merges
      # (as a required check), not deploys.
      - name: Smoke test of the built site (scripts/smoke.mjs)
        working-directory: app
        env:
          SMOKE_BROWSER: chrome
        run: npm run smoke

  data:
    name: Validate event data
    runs-on: ubuntu-latest
    # Usually 2-4 minutes (the border checks); under a minute on a pull request
    # that leaves the border check's inputs alone (it is skipped, see below).
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes or calls the API: keep the token out of .git/config.
          persist-credentials: false
          # Full history and every branch (origin/<base>), for the border check's
          # `git diff` against the pull request's base below. The whole
          # repository is about 30 MB.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Installed first so every step below has the geometry library (turf):
      # validate-events' pin-in-country check and the geometry tests skip without it.
      - name: Install repo-root dependencies (geometry library, oxlint)
        run: npm ci

      # Schema, ids, dates, coordinates and extracts on data/events.json and
      # data/events.proposed.json; warnings (e.g. a pin outside its tagged
      # countries) do not fail. No network.
      - name: Validate events
        run: node scripts/validate-events.js

      # The published reports must match the data they are generated from:
      # data/missing-coordinates-report.md (from the event files) and
      # data/selection-funnel.json (all but its sitelink_measurement block,
      # the only part that needs the network, which --check keeps). No network.
      # Fix a failure by re-running the two scripts without --check.
      - name: Generated reports are current
        run: |
          node scripts/build-missing-coordinates-report.js --check
          node scripts/build-selection-funnel.js --check

      # Pure-logic tests for the data pipeline (fix ledger, validator).
      - name: Unit tests (scripts/lib)
        run: npm test

      # oxlint over scripts/ (.oxlintrc.json at the repo root). import/named is an
      # error: a named import that the target module does not export fails here
      # instead of at run time in the monthly refresh. Warnings fail too.
      - name: Lint (scripts/)
        run: npm run lint
      # data/boundaries.json: required properties, per-name year gaps, overlaps between shapes
      # shown in the same year (with their unit tests, which need the geometry library).
      # Fails on structural errors and on any shape with fewer vertices or coarser coordinates
      # than in data/border-geometry-baseline.json (borders are never simplified); gaps and
      # unexpected overlaps are listed as warnings.
      - name: Validate boundaries
        run: npm run validate-boundaries
      # Borders vs independent Wikidata reference points (border crossings, tripoints) in
      # data/border-reference-points.json. Fails if any point is now more than 0.25 km
      # further from the drawn border than in data/border-check-baseline.json, for a year
      # inside every border period (derived from the data). No network. Report:
      # docs/border-verification.md.
      #
      # It takes about 3 minutes, so a pull request that changes none of its inputs
      # skips it; a push to main and a workflow_dispatch run always run it. The
      # inputs: the script, scripts/lib/ (it imports boundary-checks.js and
      # files.js; the whole folder, to be safe), the two app/src files
      # boundary-checks.js imports, the three data files it reads, the turf version
      # (package*.json), the Node version and this workflow. A new import or data
      # file read by verify-borders.js must be added here. The pull request's
      # checkout is GitHub's merge commit, so `origin/<base>...HEAD` is exactly
      # the pull request's changes even if the base has moved on since. A failed
      # diff (e.g. a missing ref) counts as changed. The base branch name reaches
      # the shell only through an environment variable, never as workflow text.
      - name: Did the border check's inputs change? (pull requests only)
        id: border-inputs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- \
              scripts/verify-borders.js scripts/lib/ \
              app/src/components/mapBorders.js app/src/lib/boundaryText.js \
              data/boundaries.json data/border-reference-points.json data/border-check-baseline.json \
              package.json package-lock.json .nvmrc .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No input of the border check changed against origin/${BASE_REF}: skipping it."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "An input of the border check changed against origin/${BASE_REF} (or the diff failed): running it."
          fi

      - name: Border check against reference points
        if: github.event_name != 'pull_request' || steps.border-inputs.outputs.changed != 'false'
        run: node scripts/verify-borders.js --check

  audit:
    name: Dependency audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [".", app]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes or calls the API: keep the token out of .git/config.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # BLOCKING for what ships/runs in production: runtime dependencies only
      # (--omit=dev), high or critical advisories only. `npm audit` reads the
      # lockfile and asks the registry; no install needed.
      - name: npm audit (production deps, high+, blocking)
        working-directory: ${{ matrix.dir }}
        run: npm audit --omit=dev --audit-level=high

      # REPORT-ONLY for build tooling (vite, wrangler, ...): a new advisory in a
      # dev tool should show up in the log and in Dependabot PRs but must not
      # block unrelated pull requests. continue-on-error keeps the job green.
      - name: npm audit (all deps, report only)
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        run: npm audit --audit-level=high
