name: Refresh Wikipedia summaries

# Monthly (and on demand): re-fetch every event's English Wikipedia lead. If any
# changed, open a pull request with the changed summaries and a readable list of
# the changed sentences. It never merges: the owner reviews and merges. A changed
# summary's framing review shows "may no longer apply" on the site until redone.
# The same run lists events whose title is no longer the current Wikipedia article
# title (data/title-changes.proposed.json + data/title-refresh-report.md). Titles
# are never applied here: the owner applies them with
# `node scripts/merge-proposed.js --titles --apply` after merging the PR.
#
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". Pull requests opened with the workflow token do not
# trigger the CI workflow, so the same checks run here before the PR is opened.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh summaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Re-fetch the Wikipedia summaries
        run: node scripts/refresh-extracts.js --apply --propose-titles --report="$RUNNER_TEMP/refresh-report.md"

      - name: Check for changes
        id: diff
        run: |
          # Title proposals count as changed only if the list itself changed (not just its date).
          if git cat-file -e HEAD:data/title-changes.proposed.json 2>/dev/null && node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const now = JSON.parse(fs.readFileSync("data/title-changes.proposed.json", "utf8")).changes;
            const before = JSON.parse(execSync("git show HEAD:data/title-changes.proposed.json")).changes;
            process.exit(JSON.stringify(now) === JSON.stringify(before) ? 0 : 1);'; then
            git checkout -- data/title-changes.proposed.json data/title-refresh-report.md
          fi
          if git diff --quiet -- data/events.json data/title-changes.proposed.json data/title-refresh-report.md \
             && [ -z "$(git ls-files --others --exclude-standard -- data/title-changes.proposed.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No summary or title changed; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate events
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/validate-events.js

      - name: Unit tests
        if: steps.diff.outputs.changed == 'true'
        run: node --test app/src/lib/*.test.js scripts/lib/*.test.js

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="data-refresh/${day}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/events.json data/title-changes.proposed.json data/title-refresh-report.md
          git commit -m "Refresh Wikipedia summaries (${day})"
          git push origin "$branch"
          {
            echo "Monthly refresh of the English Wikipedia summaries (${day})."
            echo
            echo "Only summaries whose text changed on Wikipedia are updated. Their framing reviews now show \"may no longer apply\" on the site until they are re-reviewed."
            echo
            echo "**Before merging:** read the changed sentences below and look for vandalism or a summary rewritten wholesale. After merging, the site rebuilds itself, including the search index, so search uses the new text."
            echo
            echo "Titles: \`data/title-refresh-report.md\` lists events whose title is no longer the current Wikipedia article title. They are NOT changed by this PR; after merging, review the report and run \`node scripts/merge-proposed.js --titles\` (dry run), then \`node scripts/merge-proposed.js --titles --apply\`."
            echo
            head -c 60000 "$RUNNER_TEMP/refresh-report.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" \
            --title "Refresh Wikipedia summaries (${day})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
