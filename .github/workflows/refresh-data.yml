name: Refresh Wikipedia summaries

# Monthly (and on demand): re-fetch every event's English Wikipedia lead and
# article title. If a summary or a title changed, open a pull request with the
# changes and a readable list of them. It never merges: the owner reviews and
# merges. A changed summary's framing review shows "may no longer apply" on the
# site until redone. Titles follow Wikipedia like summaries: plain renames are
# applied in the PR; held cases (a redirect to a section of another article,
# another Wikidata item, a stored title Wikipedia does not redirect to the
# article) are not changed and are listed in the PR description for review.
#
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". Pull requests opened with the workflow token do not
# trigger the CI workflow, so the same checks run here before the PR is opened.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh summaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The token is not left in .git/config: only the "Open a pull request"
      # step gets it, so the refresh script, npm install scripts and the build
      # cannot push.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Re-fetch the Wikipedia summaries and titles
        run: node scripts/refresh-extracts.js --apply --report="$RUNNER_TEMP/refresh-report.md"

      # The counts behind the default "most covered" list order (docs/DATA_POLICY.md,
      # "Default order"); the changed counts are appended to the report.
      - name: Re-fetch the Wikidata sitelink counts
        run: |
          set -o pipefail
          { echo; echo "## Sitelink counts"; echo; echo '```'; node scripts/refresh-sitelinks.js --apply; echo '```'; } | tee -a "$RUNNER_TEMP/refresh-report.md"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No summary or title changed; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate events
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/validate-events.js

      - name: Unit tests
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm test --prefix app

      # The same build Workers Builds runs after a merge: split-data's chunk
      # size limits, the search index (Pagefind) and the Vite build, then the
      # dist/ smoke check. A refresh that would break the deploy fails here.
      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build
          node scripts/check-dist.mjs

      # The PR description is capped (GitHub allows 65,536 characters), so the
      # full report is kept as a workflow artifact and linked from the PR.
      - name: Upload the full refresh report
        id: report
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh-report.md
          if-no-files-found: error
          retention-days: 90

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="data-refresh/${day}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/events.json
          git commit -m "Refresh Wikipedia summaries and titles (${day})"
          # Checkout ran with persist-credentials: false. Authenticate this one
          # push the way actions/checkout does (an http.extraheader), passed
          # through git's GIT_CONFIG_* environment so it is never written to
          # .git/config nor shown on the command line.
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git push origin "$branch"
          {
            echo "Monthly refresh of the English Wikipedia summaries and titles (${day})."
            echo
            echo "Only summaries whose text changed on Wikipedia are updated. Their framing reviews now show \"may no longer apply\" on the site until they are re-reviewed."
            echo
            echo "Titles follow Wikipedia too: an event whose article was renamed gets the new title (and the new URL if the old one now redirects). Event ids do not change, so links keep working. Cases that are not a plain rename are listed below as held; this PR does not change them."
            echo
            echo "**Before merging:** read the title changes, the held cases and the changed sentences below. Look for vandalism or a summary rewritten wholesale. After merging, the site rebuilds itself, including the search index, so search uses the new titles and text."
            echo
            echo "Full report (this description stops at 60,000 bytes): ${REPORT_URL}"
            echo
            # First 60,000 bytes, without splitting a multi-byte UTF-8 character.
            node -e 'const b = require("fs").readFileSync(process.argv[1]); let n = Math.min(b.length, 60000); if (n < b.length) while (n > 0 && (b[n] & 0xc0) === 0x80) n--; process.stdout.write(b.subarray(0, n)); if (n < b.length) process.stdout.write("\n\n(Cut off here: see the full report linked above.)\n");' "$RUNNER_TEMP/refresh-report.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" \
            --title "Refresh Wikipedia summaries and titles (${day})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
