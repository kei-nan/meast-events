name: Refresh Wikipedia summaries

# Monthly (and on demand): re-fetch every event's English Wikipedia lead. If any
# changed, open a pull request with the changed summaries and a readable list of
# the changed sentences. It never merges: the owner reviews and merges. A changed
# summary's framing review shows "may no longer apply" on the site until redone.
#
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests". Pull requests opened with the workflow token do not
# trigger the CI workflow, so the same checks run here before the PR is opened.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh summaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Re-fetch the Wikipedia summaries
        run: node scripts/refresh-extracts.js --apply --report="$RUNNER_TEMP/refresh-report.md"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No summary changed; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate events
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/validate-events.js

      - name: Unit tests
        if: steps.diff.outputs.changed == 'true'
        run: node --test app/src/lib/*.test.js scripts/lib/*.test.js

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="data-refresh/${day}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/events.json
          git commit -m "Refresh Wikipedia summaries (${day})"
          git push origin "$branch"
          {
            echo "Monthly refresh of the English Wikipedia summaries (${day})."
            echo
            echo "Only summaries whose text changed on Wikipedia are updated. Their framing reviews now show \"may no longer apply\" on the site until they are re-reviewed."
            echo
            echo "**Before merging:** read the changed sentences below and look for vandalism or a summary rewritten wholesale. After merging, run \`npm run load-redis\` so search uses the new text."
            echo
            head -c 60000 "$RUNNER_TEMP/refresh-report.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base main --head "$branch" \
            --title "Refresh Wikipedia summaries (${day})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
